<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#173b60" />
    <link rel="icon" type="image/png" href="/fs91-icon.png" />
    <link rel="apple-touch-icon" href="/fs91-icon.png" />
    <title>Law18Referee Management — In Development</title>
    <style>
      :root { color-scheme: light; --navy:#173b60; --pink:#c71958; --ink:#16324f; --muted:#64748b; --line:#d9e2ec; --wash:#f3f7fa; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top left,#eef4e8 0,transparent 38%),linear-gradient(135deg,#f7f9fc,#edf2f7); font-family:Inter,Arial,Helvetica,sans-serif; color:var(--ink); }
      main { position:relative; width:min(900px,100%); background:#fff; border:1px solid var(--line); border-radius:32px; box-shadow:0 24px 70px rgba(23,59,96,.12); overflow:hidden; }
      .content { padding:clamp(36px,7vw,76px); text-align:center; }
      .law18ref { display:block; width:min(660px,100%); height:auto; margin:0 auto 36px; }
      h1 { margin:0; font-size:clamp(42px,8vw,78px); line-height:.95; letter-spacing:-.05em; color:var(--navy); }
      .rule { width:78px; height:6px; border-radius:99px; background:var(--pink); margin:28px auto; }
      p { max-width:620px; margin:0 auto; font-size:clamp(18px,2.8vw,24px); line-height:1.55; color:var(--muted); }
      .brand { display:flex; align-items:center; justify-content:center; margin-top:42px; padding-top:32px; border-top:1px solid var(--line); }
      .fs91-icon { position:absolute; top:24px; left:24px; width:64px; height:64px; object-fit:contain; }
      .fs91-wordmark { width:min(330px,70%); height:auto; object-fit:contain; }
      footer { padding:20px 28px; text-align:center; background:var(--navy); color:#fff; font-size:14px; letter-spacing:.02em; }
      @media (max-width:520px) { body{padding:12px}.content{padding:94px 22px 36px}.law18ref{margin-bottom:26px}.fs91-icon{top:18px;left:18px;width:54px;height:54px}main{border-radius:22px} }
    </style>
  </head>
  <body>
    <main>
      <img class="fs91-icon" src="/fs91-icon.png" alt="FS91" />
      <section class="content">
        <img class="law18ref" src="/law18ref-logo.png" alt="Law18Referee Management" />
        <h1>In Development</h1>
        <div class="rule" aria-hidden="true"></div>
        <p>Law18Referee Management is currently unavailable while the platform remains in development.</p>
        <div class="brand">
          <img class="fs91-wordmark" src="/falksport91-wordmark.png" alt="FalkSport91" />
        </div>
      </section>
      <footer>© 2026 Law18Referee Management · By FalkSport91 LLC</footer>
    </main>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((items) => items.forEach((item) => item.unregister()));
      if ('caches' in window) caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
    </script>
  </body>
</html>
